; ======================================================================================================================
; Module: CivilEngineeringDefaults.ini
; Purpose: Centralized Configuration for Civil & Construction Converter Defaults
; Description:
;   This file defines all fallback parameters, material densities, rebar specifications,
;   geometric assumptions, and hydraulic defaults. When the user executes a cross-dimensional
;   or conditional calculation without specifying optional secondary parameters, the system
;   uses the values defined here.
;
;   Users can configure or edit these defaults directly via the Double-Shift Command Palette
;   by searching "Configure Civil Converter Defaults".
; ======================================================================================================================

[GeometricDefaults]
; --- Length to Area Fallback ---
; When converting length to area (e.g., "10 m to sqft") with no width supplied.
; Mode Options: "Square" (Width = Length, Area = L^2) | "CustomWidth"
LengthToAreaMode=Square
DefaultCustomWidthMeters=1.0
LengthToArea_Desc=Assumes a square geometry (Width = Length) so Area = Length^2 when no width is provided.

; --- Length to Volume Fallback ---
; When converting length to volume (e.g., "10 m to m3") with no cross-section supplied.
; Mode Options: "Cube" (Section = L x L, Vol = L^3) | "CustomSection"
LengthToVolumeMode=Cube
DefaultCustomSectionSqMeters=1.0
LengthToVolume_Desc=Assumes an equi-dimensional cube (Section = Length x Length) so Volume = Length^3.

; --- Area to Volume Fallback ---
; When converting area to volume (e.g., "36 sqm to m3") with no thickness or depth supplied.
; Mode Options: "CubeRoot" (Depth = sqrt(Area)) | "SlabThickness" | "CustomDepth"
AreaToVolumeMode=CubeRoot
DefaultSlabThicknessMM=150.0
DefaultCustomDepthMeters=1.0
AreaToVolume_Desc=Assumes a cubic volume where Depth = sqrt(Area) (e.g., 36 m^2 -> 6m depth = 216 m^3), or standard slab thickness.

; --- Volume to Area Fallback ---
; When converting volume to surface area coverage (e.g., "5 cum to sqft").
; Mode Options: "CubeRoot" (Depth = cbrt(Volume)) | "LayerThickness"
VolumeToAreaMode=CubeRoot
DefaultLayerThicknessMM=100.0
VolumeToArea_Desc=Assumes depth is cbrt(Volume) to determine planar area, or uses default layer spread thickness.


[MaterialDensities]
; --- Bulk & Material Densities in kg/m³ ---
; Used when converting between Volume and Mass/Weight (e.g., "10 cum to kg", "100 cft sand to kg").
DefaultMaterial=Concrete
Concrete_PCC=2300.0
Concrete_RCC=2400.0
Concrete_PCC_Desc=Plain Cement Concrete standard density (2300 kg/m^3 / ~143.6 lb/cu ft).
Concrete_RCC_Desc=Reinforced Cement Concrete standard density per IS 456 (2400 kg/m^3 / ~150 lb/cu ft).

Sand_Dry=1600.0
Sand_Dry_Desc=Standard dry river sand bulk density (1600 kg/m^3 / ~100 lb/cu ft / 45.3 kg/cft).

Aggregate_Coarse=1500.0
Aggregate_Coarse_Desc=Coarse aggregate (20mm down) loose bulk density (1500 kg/m^3 / ~42.5 kg/cft).

Steel=7850.0
Steel_Desc=Structural / Reinforcement TMT Steel standard density (7850 kg/m^3 / 0.283 lb/cu in).

Cement_Bulk=1440.0
Cement_Bulk_Desc=Ordinary Portland Cement (OPC/PPC) bulk density (1440 kg/m^3 / 40.78 kg/cft).

Soil_Compacted=1800.0
Soil_Compacted_Desc=Compacted earth / filling soil average density (1800 kg/m^3 / ~112 lb/cu ft).

Brick_Masonry=1900.0
Brick_Masonry_Desc=Standard common clay brick masonry with mortar (1900 kg/m^3).


[FluidDensities]
; --- Fluid Densities in kg/m³ ---
; Used when converting Liquid Volume to Mass (e.g., "1000 L to kg", "5000 litre diesel in tonne").
DefaultFluid=Water
Water=1000.0
Water_Desc=Standard potable water density (1000 kg/m^3 = 1.000 kg/L).

Diesel=840.0
Diesel_Desc=Standard automotive diesel fuel density at 15 deg C (840 kg/m^3 = 0.840 kg/L).

Petrol=740.0
Petrol_Desc=Standard gasoline / petrol density (740 kg/m^3 = 0.740 kg/L).

Wastewater_Sewage=1020.0
Wastewater_Sewage_Desc=Municipal raw sewage / wastewater average density (1020 kg/m^3 = 1.020 kg/L).


