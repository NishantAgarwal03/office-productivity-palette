[StructuralAndForceDefaults]
; --- Force / Pressure Area Defaults ---
; When converting Force to Pressure/Stress (e.g., "500 kN to MPa") with no loaded area given.
DefaultLoadedAreaSqMeters=1.0
DefaultLoadedArea_Desc=Applies a unit area of 1.0 m^2 when converting concentrated load to pressure.

; Concrete Grade Designations (Characteristic 28-day 150mm Cube Compressive Strength in N/mm^2 / MPa per IS 456)
M15_Strength_MPa=15.0
M20_Strength_MPa=20.0
M25_Strength_MPa=25.0
M30_Strength_MPa=30.0
M35_Strength_MPa=35.0
M40_Strength_MPa=40.0
ConcreteGrade_Desc=Nominal/Design mix 28-day compressive cube strength in N/mm^2.


[ReinforcementDefaults]
; --- Rebar / Reinforcement Steel Assumptions ---
; Standard formula: kg/m = (Diameter^2) / 162.28  (derived from 7850 kg/m^3 steel density)
DefaultRebarDiameterMM=12.0
DefaultRebarDiameter_Desc=Default diameter used when user requests rebar weight/length without specifying diameter (12 mm).

StandardStockLengthMeters=12.0
StandardStockLengthMeters_Desc=Standard commercial TMT steel bar manufactured length (12.0 metres / ~40 ft).

RebarSpacingEquivalenceBasis=EqualArea
RebarSpacingEquivalence_Desc=Maintains equal cross-sectional steel area per unit width (As2 = As1 * (dia2/dia1)^2).

RebarSpacingPitchRoundMM=5.0
RebarSpacingPitchRound_Desc=Rounds calculated rebar replacement spacing down to nearest practical site pitch (e.g., 5 mm).


[HydraulicAndFlowDefaults]
; --- Velocity and Pipe Sizing Defaults ---
DefaultFlowVelocityMPS=1.5
DefaultFlowVelocity_Desc=Standard economic flow / self-cleansing velocity for water pipes (1.5 m/s / ~5.0 ft/s).

DefaultPipeDiameterMM=100.0
DefaultPipeDiameter_Desc=Standard nominal pipe diameter default (100 mm / 4 inch).

ManningRoughness_PVC=0.009
ManningRoughness_Concrete=0.013
ManningRoughness_CastIron=0.012
HydraulicRoughness_Desc=Manning's roughness coefficient (n) for sewer/drain open channel calculations.


[SlopeAndSurveyDefaults]
; --- Slope & Fall Assumptions ---
DefaultSlopeRunMeters=10.0
DefaultSlopeRun_Desc=Standard horizontal run baseline used to evaluate elevation fall from a slope ratio (e.g. 1:100 fall over 10m = 100mm).


